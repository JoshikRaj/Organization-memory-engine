# docker-compose.yml

# One command starts everything in the right order:
#   docker compose up
#
# To rebuild after code changes:
#   docker compose up --build
#
# To stop everything:
#   docker compose down

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: org-memory-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: memory_engine
    ports:
      - "5432:5432"
    volumes:
      - orgmem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: neo4j-orgmem
    environment:
      NEO4J_AUTH: neo4j/orgmemory123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - orgmem-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: org-memory-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost references — inside Docker, use service names
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build: .
    container_name: org-memory-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

  slack-bot:
    build: .
    container_name: org-memory-slack-bot
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command: python -m src.slack_bot.bot
    restart: unless-stopped

volumes:
  orgmem-postgres-data:
    # Named volumes persist data across container restarts and rebuilds
    # Your data survives: docker compose down && docker compose up
  orgmem-neo4j-data:
